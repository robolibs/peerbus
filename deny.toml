# cargo-deny configuration.
#
# Run locally: `cargo deny check`
# Drives the `deny` job in `.github/workflows/ci.yml`.

[graph]
all-features = true

[advisories]
# Fail the build on known security advisories. Allow vulnerability
# IDs explicitly via `ignore` if we have a documented reason.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[licenses]
# Allowed licenses for the dependency graph. Anything outside this
# list fails the build — forces an intentional decision when a new
# license enters the cone.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
# We intentionally allow several Tokio/iroh deps with multiple
# minor versions during the pre-1.0 churn. Add explicit skips here
# if cargo-deny starts noising.
skip = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
# Allowed git sources. `datapod` is pulled from codeberg per
# Cargo.toml. iroh and friends come from crates.io.
allow-git = [
    "https://codeberg.org/robolibs/datapod",
]
