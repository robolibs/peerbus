[package]
name = "peerbus"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["Trim Bresilla <trim.bresilla@gmail.com>"]
description = "Typed zero-copy messaging for robotics: loan-publish-consume pub/sub over shared memory on the same host, iroh peer-to-peer QUIC streams over the network, one service-oriented API for both"
license = "MIT"
readme = "README.md"
repository = "https://codeberg.org/robolibs/peerbus"
homepage = "https://codeberg.org/robolibs/peerbus"
keywords = ["robotics", "ipc", "pubsub", "quic", "shared-memory"]
categories = ["network-programming", "concurrency", "embedded"]
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "LIMITATIONS.md",
    "include/**/*.h",
    "examples/c_abi/*.c",
    "examples/c_abi/Makefile",
    "examples/python_binding/*.py",
    "examples/python_binding/Makefile",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
# `rlib` for normal Rust use; `cdylib` for the C ABI (`src/ffi.rs`) and
# the Python extension module (`--features python`, built by maturin).
crate-type = ["rlib", "cdylib"]

[features]
default = ["tracing"]

# Tracing spans / events at every loan / publish / consume.
tracing = ["dep:tracing"]

# Python bindings (pyo3). Builds the cdylib as a CPython extension.
python = ["dep:pyo3"]
python-extension = ["python"]

[profile.python]
inherits = "dev"

[dependencies]
datapod = { git = "https://codeberg.org/robolibs/datapod.git", tag = "0.6.2" }
thiserror = "2.0"
bytes = "1"
# bytemuck for Plain-Old-Data typed payloads placed directly into
# SHM slots. zerocopy is a good alternative; picking one later.
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
libc = "0.2"

# Pure-Rust SHM substrate for the local transport. Keep the
# cross-process control plane small and explicit; no bindgen/clang.
shared_memory = "0.12.4"
raw_sync = "0.1.5"

# iroh — peer-to-peer QUIC. Brings hole punching, relay fallback,
# and ed25519 EndpointId addressing. Always on (no `remote` feature
# gate any more); cross-host pub/sub is a core part of the library.
iroh = "1.0.0-rc.0"
# authbox — DID:KEY encode/parse for ed25519 EndpointIds, so peers
# can be addressed as `did:key:z6Mk…` strings interchangeably with
# iroh's native base32 form.
authbox = { git = "https://codeberg.org/robolibs/authbox.git", tag = "0.1.1" }
# blake3 — derive deterministic SecretKeys from human-readable
# identity strings.
blake3 = { version = "1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", default-features = false, features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

tracing = { version = "0.1", optional = true }
pyo3 = { version = "0.23", optional = true, features = [
    # Python zero-copy sample views need the buffer protocol slots, which PyO3
    # exposes for the limited API starting at Python 3.11.
    "abi3-py311",
    "extension-module",
] }

[dev-dependencies]
tempfile = "3.10"
# Property-based tests for the SHM allocator's invariants. Random
# sequences of pop/push/publish/acquire/release; asserts no slot
# leaks and seq monotonicity.
proptest = { version = "1.5", default-features = false, features = ["std"] }
# wirebit is peerbus's TEST substrate, not a runtime dep. iroh wraps
# its own UDP socket so plugging wirebit's TunLink underneath is
# nontrivial; see PLAN §Phase 6 for the current testing strategy.
wirebit = { git = "https://codeberg.org/robolibs/wirebit.git", rev = "f4b72c4c2c16563a8897e3f7f0fe6efbfee97441" }
# minifb is for the video subscriber example only — single-window
# raw framebuffer. Force Wayland-only on Linux: no X11/XWayland backend
# for the GUI example.
minifb = { version = "0.27", default-features = false, features = ["wayland"] }
# tracing-subscriber for the examples so iroh / peerbus emit logs
# under RUST_LOG=iroh=info,peerbus=info etc.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

